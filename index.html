<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กลับมาได้มั้ย 💔</title>
  <style>
    body {
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: "Prompt", sans-serif;
      text-align: center;
      margin: 0;
      overflow: hidden;
    }
    h1 {
      color: #3a3a3a;
      font-size: 2.2rem;
      margin-bottom: 40px;
      z-index: 1;
    }
    button {
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      z-index: 1;
    }
    #yesBtn {
      background-color: #ff5c8a;
      color: white;
      margin-right: 10px;
    }
    #noBtn {
      background-color: #ffffff;
      color: #333;
      position: absolute;
    }
    #message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 2rem;
      color: #ff4081;
      font-weight: bold;
      text-shadow: 2px 2px 10px rgba(255,255,255,0.9);
      opacity: 0;
      transition: all 0.6s ease-out;
      z-index: 2;
      text-align: center;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <h1>กลับมาได้มั้ย 💔</h1>
  <div>
    <button id="yesBtn">กลับมาแล้วค้าบ 💞</button>
    <button id="noBtn">ไม่กลับหรอก 😢</button>
  </div>

  <div id="message">กลับมาแล้วห้ามไปไหนอีกนะ ห้ามคืนคำนะเบบี๋ รักนะค้าบ🤭</div>
  <canvas id="fireworks"></canvas>

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - noBtn.clientWidth);
      const y = Math.random() * (window.innerHeight - noBtn.clientHeight);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener("click", () => {
      message.style.transform = "translate(-50%, -50%) scale(1)";
      message.style.opacity = "1";
      launchFireworks();
      setTimeout(() => {
        message.style.opacity = "0";
        message.style.transform = "translate(-50%, -50%) scale(0)";
      }, 5000);
    });

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 5;
        this.speedY = (Math.random() - 0.5) * 5;
        this.life = 100;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life--;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    function launchFireworks() {
      for (let i = 0; i < 80; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height / 2;
        const color = `hsl(${Math.random() * 360}, 100%, 70%)`;
        for (let j = 0; j < 30; j++) {
          particles.push(new Particle(x, y, color));
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
      });
      requestAnimationFrame(animate);
    }
    animate();
  });
  </script>
</body>
</html>
